name: Release

# Builds, uploads and publishes a release when a GitHub release is published.
# The tag must match the version in Cargo.toml (e.g. v1.0.0).
#
# Environments: the jobs that publish (GitHub release assets and npm) run in a
# GitHub environment, so its protection rules (required reviewers, allowed
# tags) and its variables apply. Releases use `stable`, pre-releases `next`;
# a manual run can choose any environment.
#
# npm: packages are published with trusted publishing (OIDC) and provenance.
# No npm token is needed; see docs/development.md for the one-time setup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. v1.0.0)
        required: true
        type: string
      environment:
        description: Environment for the publishing jobs (default stable, or next for pre-release tags)
        required: false
        type: environment

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Compare the tag with Cargo.toml
        run: |
          version=$(node .github/scripts/update-npm-versions.js --print)
          echo "Cargo.toml version: $version, tag: $TAG"
          if [ "v$version" != "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi

      - name: Release metadata
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$EVENT" = "release" ]; then
            prerelease="$RELEASE_PRERELEASE"
          else
            case "$TAG" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
          fi
          if [ "$prerelease" = "true" ]; then
            environment=next
            dist_tag=next
          else
            environment=stable
            dist_tag=latest
          fi
          if [ -n "$INPUT_ENVIRONMENT" ]; then
            environment="$INPUT_ENVIRONMENT"
          fi
          {
            echo "environment=$environment"
            echo "dist-tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $TAG in the '$environment' environment (npm tag: $dist_tag)"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: .github/scripts/build.sh "${{ matrix.target }}"

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/anymon"
          "$bin" --version
          "$bin" --version | grep -q "${TAG#v}"
          "$bin" --once --color never -- echo "anymon works"

      - name: Package
        shell: bash
        run: .github/scripts/package.sh "${{ matrix.target }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: anymon-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github:
    name: Upload release assets
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anymon-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS

  npm:
    name: Publish to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.version.outputs.environment }}
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this job's OIDC token for a
      # short-lived publish credential and signs provenance with it.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Update npm to the latest version
        run: |
          npm install --global npm@latest
          echo "node $(node --version), npm $(npm --version)"

      - uses: actions/download-artifact@v4
        with:
          pattern: anymon-*
          path: dist
          merge-multiple: true

      - name: Prepare packages
        run: .github/scripts/prepare-npm.sh dist

      - name: Publish
        env:
          DIST_TAG: ${{ needs.version.outputs.dist-tag }}
        run: .github/scripts/publish-npm.sh
